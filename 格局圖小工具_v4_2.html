<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>住展找房 — 格局圖工具 v4</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0ede8; --sb:#faf9f7; --wh:#fff; --bd:#e5e0d8;
  --ac:#3d6b84; --acl:#e8f2f7;
  --rd:#c0392b; --rdl:#fdf0ee;
  --t1:#1a1a1a; --t2:#64748b; --t3:#9ca3af;
  --m1:#A7B9B9; --m2:#D6C5B3; --m3:#D2D8D8;
  --m4:#C4A4A4; --m5:#B8C4C2; --m6:#D4C8B8; --m7:#BDB8C4; --m8:#C8B8B0;
  --wall:#1e293b; --win:#e0f3fc; --winb:#7dd3fc; --fb:#475569; --sel:#3d6b84;
  --s1:0 1px 3px rgba(0,0,0,.08); --s3:0 12px 40px rgba(0,0,0,.12);
  --r:8px; --rl:20px; --sbw:276px;
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--t1);height:100dvh;display:flex;overflow:hidden;overscroll-behavior:none}
#sidebar{width:var(--sbw);background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;z-index:20;transition:transform .28s cubic-bezier(.4,0,.2,1)}
#sbhead{padding:18px 18px 14px;border-bottom:1px solid var(--bd);flex-shrink:0}
#sbhead h1{font-size:13px;font-weight:900;line-height:1.35;letter-spacing:-.01em}
.badge{margin-top:5px;display:inline-flex;font-family:'DM Mono',monospace;font-size:9px;color:var(--ac);background:var(--acl);padding:2px 7px;border-radius:4px;letter-spacing:.05em}
#sbscroll{flex:1;overflow-y:auto;padding:10px 12px 24px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
#sbscroll::-webkit-scrollbar{width:3px}
#sbscroll::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.sec{margin-bottom:12px}
.sechd{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;cursor:pointer;user-select:none;border-radius:4px}
.sechd:hover{background:rgba(0,0,0,.02)}
.sectitle{font-size:9px;font-weight:900;color:var(--t3);letter-spacing:.18em;text-transform:uppercase}
.secarrow{font-size:9px;color:var(--t3);transition:transform .2s;display:inline-block}
.sechd.open .secarrow{transform:rotate(90deg)}
.secbody{overflow:hidden;transition:max-height .24s ease}
.secbody.closed{max-height:0!important}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px 0}
.tbtn{background:var(--wh);border:1.5px solid var(--bd);border-radius:var(--r);padding:9px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .13s;font-family:'Noto Sans TC',sans-serif}
.tbtn:hover{border-color:var(--ac);background:var(--acl);transform:translateY(-1px);box-shadow:var(--s1)}
.tbtn:active{transform:scale(.97)}
.ticon{display:flex;align-items:center;justify-content:center;height:22px}
.tlabel{font-size:10px;font-weight:700;color:var(--t2)}
.frow{background:var(--wh);border:1.5px solid var(--bd);border-radius:var(--r);padding:8px 11px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .13s;margin-bottom:4px;font-family:'Noto Sans TC',sans-serif}
.frow:hover{border-color:var(--ac);background:var(--acl)}
.frow:active{transform:scale(.98)}
.sw{flex-shrink:0;border:1px solid rgba(0,0,0,.14)}
.fn{font-size:11px;font-weight:700;color:var(--t2)}
.snaprow{display:flex;align-items:center;justify-content:space-between;background:var(--wh);border:1.5px solid var(--bd);border-radius:var(--r);padding:8px 11px;cursor:pointer;transition:border-color .13s;margin-top:2px}
.snaprow:hover{border-color:var(--ac)}
.snaplabel{font-size:11px;font-weight:700;color:var(--t2)}
.pill{width:36px;height:20px;background:var(--bd);border-radius:10px;position:relative;transition:background .2s;flex-shrink:0;pointer-events:none}
.pill.on{background:var(--ac)}
.pill::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pill.on::after{transform:translateX(16px)}
.lgrid{display:flex;flex-wrap:wrap;gap:5px;padding:4px 0 6px}
.ptag{background:var(--wh);border:1.5px solid var(--bd);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--t2);cursor:pointer;transition:all .13s;white-space:nowrap;font-family:'Noto Sans TC',sans-serif}
.ptag:hover{border-color:var(--ac);background:var(--acl);color:var(--ac)}
.sizerow{display:flex;gap:5px;margin:4px 0 6px}
.sizebtn{flex:1;padding:6px 4px;border:1.5px solid var(--bd);border-radius:var(--r);background:var(--wh);cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:700;color:var(--t2);font-size:10px;transition:all .13s}
.sizebtn:hover,.sizebtn.on{border-color:var(--ac);background:var(--acl);color:var(--ac)}
.customrow{display:flex;gap:5px;margin-top:2px}
#cinput{flex:1;border:1.5px solid var(--bd);border-radius:var(--r);padding:8px 10px;font-size:11px;font-family:'Noto Sans TC',sans-serif;outline:none;background:var(--wh);transition:border-color .13s}
#cinput:focus{border-color:var(--ac)}
#cadd{border:1.5px solid var(--bd);border-radius:var(--r);background:var(--wh);padding:8px 10px;cursor:pointer;font-size:11px;font-weight:900;color:var(--t2);font-family:'Noto Sans TC',sans-serif;transition:all .13s;white-space:nowrap}
#cadd:hover{border-color:var(--ac);background:var(--acl);color:var(--ac)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:52px;background:var(--wh);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0;gap:6px}
#tbl{display:flex;align-items:center;gap:6px}
#tbr{display:flex;align-items:center;gap:5px}
#mobbtn{display:none;width:34px;height:34px;border:1.5px solid var(--bd);border-radius:var(--r);background:var(--wh);cursor:pointer;align-items:center;justify-content:center;font-size:15px}
#zobtns{display:none;align-items:center;gap:4px}
.zobtn{height:30px;padding:0 9px;border:1.5px solid var(--bd);border-radius:var(--r);background:var(--wh);cursor:pointer;font-size:10px;font-weight:700;color:var(--t2);font-family:'Noto Sans TC',sans-serif;transition:all .13s}
.zobtn:hover{border-color:var(--ac);color:var(--ac);background:var(--acl)}
.hbtn{width:34px;height:34px;border:1.5px solid var(--bd);border-radius:var(--r);background:var(--wh);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2);transition:all .13s}
.hbtn:hover:not(:disabled){border-color:var(--ac);background:var(--acl)}
.hbtn:disabled{opacity:.32;cursor:not-allowed}
.divv{width:1px;height:20px;background:var(--bd);margin:0 2px}
.abtn{height:34px;padding:0 14px;border-radius:var(--r);font-size:11px;font-weight:900;cursor:pointer;font-family:'Noto Sans TC',sans-serif;border:none;transition:all .13s}
.abtn.danger{background:var(--rdl);color:var(--rd)}
.abtn.danger:hover{background:var(--rd);color:#fff}
.abtn.primary{background:var(--t1);color:#fff}
.abtn.primary:hover{background:#333}
#viewport{flex:1;position:relative;overflow:hidden;background:var(--bg);cursor:default}
#cwrap{position:absolute;transform-origin:0 0}
canvas{display:block;touch-action:none;box-shadow:var(--s3);border-radius:8px}
#selbar{display:none;position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--wh);border:1.5px solid var(--bd);border-radius:var(--rl);box-shadow:var(--s3);padding:6px 12px;gap:6px;align-items:center;z-index:25}
.sbbtn{height:34px;padding:0 10px;border-radius:12px;border:none;background:transparent;cursor:pointer;font-size:11px;font-weight:700;color:var(--t2);display:flex;align-items:center;gap:3px;font-family:'Noto Sans TC',sans-serif;transition:all .13s}
.sbbtn:hover{background:var(--bg)}
.sbbtn.del:hover{background:var(--rdl);color:var(--rd)}
.sbdiv{width:1px;height:18px;background:var(--bd)}
#zoombadge{position:absolute;bottom:18px;right:14px;background:var(--wh);border:1px solid var(--bd);border-radius:5px;padding:3px 9px;font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);pointer-events:none}
#moboverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:19}
#nav-hint{position:absolute;bottom:18px;left:14px;display:flex;align-items:center;gap:5px;font-size:9px;font-weight:700;color:var(--t3);background:var(--wh);border:1px solid var(--bd);border-radius:5px;padding:3px 9px;pointer-events:none;opacity:.8}
.nh-div{color:var(--bd)}
@media(max-width:768px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);z-index:30}
  #sidebar.open{transform:translateX(0);box-shadow:var(--s3)}
  #moboverlay.show{display:block}
  #mobbtn{display:flex}
  /* 側欄按鈕加大 */
  .frow{padding:11px 13px;margin-bottom:6px}
  .fn{font-size:13px}
  .tbtn{padding:11px 8px}
  .tlabel{font-size:11px}
  /* 頂欄按鈕加大 */
  .hbtn{width:40px;height:40px;font-size:16px}
  .abtn{height:40px;padding:0 16px;font-size:12px}
  /* 選取 bar 加大、移到底部更高處 */
  #selbar{bottom:28px;padding:8px 14px;gap:8px;border-radius:var(--rl)}
  .sbbtn{height:40px;padding:0 12px;font-size:12px}
  /* nav-hint 在手機隱藏（太小看不清） */
  #nav-hint{display:none}
  /* 縮放徽章移到左下 */
  #zoombadge{bottom:28px;right:auto;left:14px}
  /* 上下移按鈕加大 */
  .zobtn{height:38px;padding:0 12px;font-size:11px}
  /* 格點吸附 toggle 加大 */
  .snaprow{padding:11px 13px}
  .snaplabel{font-size:12px}
  /* 字級按鈕加大 */
  .sizebtn{padding:8px 4px;font-size:11px}
  /* 自訂字級輸入框加大 */
  #fsinput{padding:10px;font-size:12px}
  #fsapply{padding:10px;font-size:12px}
  /* 空間標籤 tag 加大 */
  .ptag{padding:7px 12px;font-size:12px}
}
@media(max-width:480px){
  :root{--sbw:260px}
  .abtn.danger{display:none}
  #topbar{padding:0 8px;gap:4px}
}
</style>
</head>
<body>
<aside id="sidebar">
  <div id="sbhead">
    <h1>住展找房<br>室內格局小工具</h1>
    <span class="badge">v4.0 · Morandi</span>
  </div>
  <div id="sbscroll">
    <div class="sec">
      <div class="secbody" id="bd-struct" style="max-height:400px">
        <div class="tgrid">
          <button class="tbtn" id="btn-wall"><div class="ticon"><div style="width:34px;height:5px;background:var(--wall);border-radius:2px"></div></div><span class="tlabel">實牆</span></button>
          <button class="tbtn" id="btn-window"><div class="ticon"><div style="width:34px;height:5px;background:var(--win);border:1px solid var(--winb);border-radius:1px"></div></div><span class="tlabel">窗戶</span></button>
          <button class="tbtn" id="btn-door"><div class="ticon" style="font-size:20px">🚪</div><span class="tlabel">推開門</span></button>
        </div>
        <div class="snaprow" id="snaprow"><span class="snaplabel">格點吸附（20px）</span><div class="pill on" id="snappill"></div></div>
      </div>
    </div>
    <div class="sec">
      <div class="sechd open" id="hd-label"><span class="sectitle">空間標籤</span></div>
      <div class="secbody" id="bd-label" style="max-height:600px">
        <div style="font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.08em;margin-bottom:6px">常用空間（點擊即加入）</div>
        <div class="lgrid" id="presetgrid">
          <div class="ptag">客廳</div><div class="ptag">餐廳</div><div class="ptag">廚房</div>
          <div class="ptag">主臥</div><div class="ptag">次臥</div><div class="ptag">兒童房</div>
          <div class="ptag">書房</div><div class="ptag">衛浴</div><div class="ptag">主衛</div>
          <div class="ptag">客衛</div><div class="ptag">陽台</div><div class="ptag">後陽台</div>
          <div class="ptag">玄關</div><div class="ptag">儲藏室</div><div class="ptag">更衣室</div>
          <div class="ptag">工作陽台</div>
        </div>
        <div style="font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.08em;margin:6px 0 5px">字級</div>
        <div class="sizerow">
          <button class="sizebtn" data-sz="sm">小 12px</button>
          <button class="sizebtn on" data-sz="md">中 18px</button>
          <button class="sizebtn" data-sz="lg">大 26px</button>
        </div>
        <div style="font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.08em;margin:4px 0 3px">自訂字級（8–120 px）</div>
        <div class="customrow" style="margin-top:2px">
          <input id="fsinput" type="number" min="8" max="120" placeholder="輸入數值…" style="flex:1;border:1.5px solid var(--bd);border-radius:var(--r);padding:7px 10px;font-size:11px;font-family:'Noto Sans TC',sans-serif;outline:none;background:var(--wh);transition:border-color .13s" onfocus="this.style.borderColor='var(--ac)'" onblur="this.style.borderColor='var(--bd)'">
          <button id="fsapply" style="border:1.5px solid var(--bd);border-radius:var(--r);background:var(--wh);padding:7px 10px;cursor:pointer;font-size:11px;font-weight:900;color:var(--t2);font-family:'Noto Sans TC',sans-serif;transition:all .13s;white-space:nowrap" onmouseover="this.style.borderColor='var(--ac)';this.style.color='var(--ac)'" onmouseout="this.style.borderColor='var(--bd)';this.style.color='var(--t2)'">套用</button>
        </div>
        <div style="font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.08em;margin:4px 0 5px">自訂</div>
        <div class="customrow"><input id="cinput" placeholder="輸入標籤…"><button id="cadd">＋ 加入</button></div>
      </div>
    </div>
    <div class="sec">
      <div class="sechd open" id="hd-bed"><span class="sectitle">床具</span></div>
      <div class="secbody" id="bd-bed" style="max-height:300px">
        <button class="frow" id="btn-bed_double"><div class="sw" style="width:34px;height:24px;border-radius:3px;background:var(--m5)"></div><span class="fn">雙人床</span></button>
        <button class="frow" id="btn-bed_single"><div class="sw" style="width:22px;height:24px;border-radius:3px;background:var(--m7)"></div><span class="fn">單人床</span></button>
      </div>
    </div>
    <div class="sec">
      <div class="sechd open" id="hd-seat"><span class="sectitle">座椅</span></div>
      <div class="secbody" id="bd-seat" style="max-height:300px">
        <button class="frow" id="btn-sofa"><div class="sw" style="width:38px;height:17px;border-radius:3px;background:var(--m1)"></div><span class="fn">三人沙發</span></button>
        <button class="frow" id="btn-sofa_single"><div class="sw" style="width:20px;height:20px;border-radius:3px;background:var(--m2)"></div><span class="fn">單人沙發</span></button>
        <button class="frow" id="btn-stool"><svg width="18" height="22" style="flex-shrink:0"><rect x="1" y="13" width="16" height="8" rx="2" fill="#C4A4A4" stroke="#475569" stroke-width="1.2"/><rect x="1" y="2" width="16" height="7" rx="2" fill="#C4A4A4" stroke="#475569" stroke-width="1.2"/><line x1="3" y1="9" x2="3" y2="13" stroke="#475569" stroke-width="1.5"/><line x1="15" y1="9" x2="15" y2="13" stroke="#475569" stroke-width="1.5"/></svg><span class="fn">椅子</span></button>
      </div>
    </div>
    <div class="sec">
      <div class="sechd open" id="hd-table"><span class="sectitle">桌子</span></div>
      <div class="secbody" id="bd-table" style="max-height:300px">
        <button class="frow" id="btn-dining_table"><div class="sw" style="width:32px;height:20px;border-radius:3px;background:var(--m8)"></div><span class="fn">餐桌椅組</span></button>
        <button class="frow" id="btn-desk"><div class="sw" style="width:36px;height:15px;border-radius:2px;background:var(--m3)"></div><span class="fn">工作書桌</span></button>
        <button class="frow" id="btn-comp_desk"><div class="sw" style="width:36px;height:18px;border-radius:2px;background:var(--m3)"></div><span class="fn">電腦桌</span></button>
        <button class="frow" id="btn-vanity"><div class="sw" style="width:36px;height:22px;border-radius:2px;background:var(--m3)"></div><span class="fn">化妝台</span></button>
      </div>
    </div>
    <div class="sec">
      <div class="sechd open" id="hd-storage"><span class="sectitle">收納櫃</span></div>
      <div class="secbody" id="bd-storage" style="max-height:400px">
        <button class="frow" id="btn-storage_unit"><div class="sw" style="width:18px;height:26px;border-radius:2px;background:#c8b89a;border:1px solid #6b4f2a"></div><span class="fn">收納櫃</span></button>
        <button class="frow" id="btn-tv_stand"><div class="sw" style="width:40px;height:12px;border-radius:2px;background:var(--m8)"></div><span class="fn">電視櫃</span></button>
      </div>
    </div>
    <div class="sec">
      <div class="sechd open" id="hd-sanitary"><span class="sectitle">廚衛設備</span></div>
      <div class="secbody" id="bd-sanitary" style="max-height:400px">
        <button class="frow" id="btn-toilet"><div class="sw" style="width:20px;height:26px;border-radius:4px 4px 10px 10px;background:var(--m3)"></div><span class="fn">馬桶</span></button>
        <button class="frow" id="btn-bathtub"><div class="sw" style="width:36px;height:20px;border-radius:8px;background:var(--m1)"></div><span class="fn">浴缸</span></button>
        <button class="frow" id="btn-sink"><svg width="22" height="22" style="flex-shrink:0;border:1px solid rgba(0,0,0,.14);border-radius:2px"><rect width="22" height="22" fill="#D2D8D8"/><rect x="3" y="5" width="16" height="14" rx="2" fill="rgba(255,255,255,.7)" stroke="#475569" stroke-width="0.9"/><circle cx="11" cy="16" r="2" fill="rgba(100,116,139,.45)"/><rect x="8" y="3" width="6" height="4" rx="1" fill="#D2D8D8" stroke="#475569" stroke-width="0.8"/><line x1="11" y1="3" x2="11" y2="1" stroke="#475569" stroke-width="1.5"/><path d="M11 1 Q15 1 15 4" fill="none" stroke="#475569" stroke-width="1.5"/><line x1="15" y1="4" x2="15" y2="6" stroke="#475569" stroke-width="1.5"/></svg><span class="fn">洗手台</span></button>
        <button class="frow" id="btn-shower"><svg width="22" height="22" style="flex-shrink:0;border:1px solid rgba(0,0,0,.14);border-radius:2px"><rect width="22" height="22" fill="rgba(209,236,248,.5)"/><line x1="0" y1="0" x2="22" y2="22" stroke="rgba(100,116,139,.3)" stroke-width="1"/><line x1="22" y1="0" x2="0" y2="22" stroke="rgba(100,116,139,.3)" stroke-width="1"/><circle cx="11" cy="6" r="5" fill="#D2D8D8" stroke="#475569" stroke-width="0.9"/><circle cx="11" cy="6" r="2.2" stroke="rgba(100,116,139,.4)" stroke-width="0.7" fill="none"/><circle cx="8.5" cy="4" r="0.8" fill="rgba(71,85,105,.5)"/><circle cx="11" cy="3.5" r="0.8" fill="rgba(71,85,105,.5)"/><circle cx="13.5" cy="4" r="0.8" fill="rgba(71,85,105,.5)"/><circle cx="8.5" cy="6.5" r="0.8" fill="rgba(71,85,105,.5)"/><circle cx="13.5" cy="6.5" r="0.8" fill="rgba(71,85,105,.5)"/></svg><span class="fn">乾濕分離</span></button>
        <button class="frow" id="btn-island"><div class="sw" style="width:40px;height:22px;border-radius:2px;background:var(--m6)"></div><span class="fn">廚房中島</span></button>
        <button class="frow" id="btn-stove"><div class="sw" style="width:30px;height:30px;border-radius:2px;background:var(--m6)"></div><span class="fn">獨立瓦斯爐</span></button>
        <button class="frow" id="btn-towel_rack"><div class="sw" style="width:40px;height:10px;border-radius:1px;background:var(--m3)"></div><span class="fn">毛巾架</span></button>

function dDining(c,w,h){const tw=w*.55,th=h*.5;mr(c,-tw/2,-th/2,tw,th,P.M8);c.fillStyle=P.M2;c.strokeStyle=P.FB;c.lineWidth=1.2;const cw=21,ch=15;[[-tw/2+5,-th/2-ch-3],[tw/2-cw-5,-th/2-ch-3],[-tw/2+5,th/2+3],[tw/2-cw-5,th/2+3]].forEach(([x,y])=>{c.fillRect(x,y,cw,ch);c.strokeRect(x,y,cw,ch)});const sw=13,sh=19;[[-tw/2-sw-3,-sh/2],[tw/2+3,-sh/2]].forEach(([x,y])=>{c.fillRect(x,y,sw,sh);c.strokeRect(x,y,sw,sh)})}

function dBathtub(c,w,h){c.fillStyle=P.M1;c.strokeStyle=P.FB;c.lineWidth=1.5;c.beginPath();c.roundRect(-w/2,-h/2,w,h,9);c.fill();c.stroke();c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1;c.beginPath();c.roundRect(-w/2+8,-h/2+8,w-16,h-16,6);c.stroke();c.fillStyle=P.FB;c.beginPath();c.arc(0,-h/2+11,3.5,0,Math.PI*2);c.fill()}
function dSink(c,w,h){
  // 台面底色

function dShower(c,w,h){

  c.fillStyle=P.M6;c.strokeStyle=P.FB;c.lineWidth=1;
  c.fillRect(w/2-gw,-h/2,gw,mh);c.strokeRect(w/2-gw,-h/2,gw,mh);

  c.beginPath();c.moveTo(w/2-gw,-h/2+mh*0.5);c.lineTo(w/2,-h/2+mh*0.5);c.stroke();

  c.strokeStyle=P.FB;c.lineWidth=1.5;
  c.beginPath();c.moveTo(-w/2+10,h/2-8);c.lineTo(w/2-10,h/2-8);c.stroke();
}
function dIsland(c,w,h){
  // 廚房中島：桌面+邊線
  mr(c,-w/2,-h/2,w,h,P.M6);
  c.strokeStyle='rgba(0,0,0,.15)';c.lineWidth=1;
  c.strokeRect(-w/2+8,-h/2+8,w-16,h-16);
  // 四角腳標記
  c.fillStyle='rgba(71,85,105,.4)';
  [[-w/2+5,-h/2+5],[w/2-5,-h/2+5],[-w/2+5,h/2-5],[w/2-5,h/2-5]].forEach(function(p){
    c.beginPath();c.arc(p[0],p[1],3,0,Math.PI*2);c.fill();
  });
}
function dStove(c,w,h){
  // 獨立瓦斯爐：4爐頭
  mr(c,-w/2,-h/2,w,h,P.M6);
  var bs=10;
  [[-w/4,-h/4],[w/4,-h/4],[-w/4,h/4],[w/4,h/4]].forEach(function(p){
    c.strokeStyle=P.FB;c.lineWidth=1.2;
    c.beginPath();c.arc(p[0],p[1],bs/2,0,Math.PI*2);c.stroke();

function dTowelRack(c,w,h){
  // 毛巾架：橫桿+兩端支架
  c.fillStyle=P.M3;c.strokeStyle=P.FB;c.lineWidth=1.5;
  c.fillRect(-w/2,-h/2,w,h);c.strokeRect(-w/2,-h/2,w,h);

function dText(c,w,h,el){

const snp=v=>snapOn?Math.round(v/GRID)*GRID:v;
function saveH(){const s=JSON.stringify(els.map(e=>{const r={...e};delete r.draw;return r}));hist=hist.slice(0,hIdx+1);hist.push(s);if(hist.length>60)hist.shift();hIdx=hist.length-1;updH()}
function restoreH(s){const d=JSON.parse(s);els=d.map(o=>{const c=CFG[o._t]||{};return{...c,...o,draw:c.draw}});sel=null;render()}
function undo(){if(hIdx>0){hIdx--;restoreH(hist[hIdx]);updH()}}
function redo(){if(hIdx<hist.length-1){hIdx++;restoreH(hist[hIdx]);updH()}}
function updH(){undobtn.disabled=hIdx<=0;redobtn.disabled=hIdx>=hist.length-1}

function addEl(type,txt,tsz){
  txt=txt||'';tsz=tsz||'md';
  const cfg=CFG[type];if(!cfg)return;
  const el={_t:type,...cfg,rotation:0,txt:txt,tsz:tsz};
  if(cfg.type==='line'){
    // 線段：隨機位置，確保不超出畫布
    var lx=snp(GRID+Math.random()*(CW-GRID*2-160));
    var ly=snp(GRID+Math.random()*(CH-GRID*2));
    el.x1=lx;el.y1=ly;el.x2=lx+160;el.y2=ly;
  } else {
    var ew=cfg.w||80, eh=cfg.h||40;
    // 找上一個同類型，在它周圍隨機出現
    var lastSame=null;
    for(var i=els.length-1;i>=0;i--){
      if(els[i]._t===type){lastSame=els[i];break;}
    }
    var ex,ey;
    if(lastSame){
      // 以上一個為中心，在周圍 1~3 格內隨機
      var range=GRID*3;
      var tries=0;
      do {
        var rx=(Math.random()*2-1)*range;
        var ry=(Math.random()*2-1)*range;
        // 確保不跟上一個完全重疊
        if(Math.abs(rx)<GRID&&Math.abs(ry)<GRID){rx=rx<0?-GRID:GRID;ry=ry<0?-GRID:GRID;}
        ex=snp(lastSame.x+rx);
        ey=snp(lastSame.y+ry);
        tries++;
      } while((ex<0||ex+ew>CW||ey<0||ey+eh>CH)&&tries<20);
      // 20次還超出就回畫布中間隨機
      if(ex<0||ex+ew>CW||ey<0||ey+eh>CH){
        ex=snp(GRID+Math.random()*(CW-ew-GRID*2));
        ey=snp(GRID+Math.random()*(CH-eh-GRID*2));
      }
    } else {
      // 第一次新增：畫布中間隨機出現
      ex=snp(CW/2-ew/2+(Math.random()-0.5)*GRID*2);
      ey=snp(CH/2-eh/2+(Math.random()-0.5)*GRID*2);
    }
    el.x=ex; el.y=ey;
  }
  els.push(el);sel=el;saveH();render();
}

function initCanvas(){
  canvas.width=CW*CR;canvas.height=CH*CR;

  ctx.scale(CR,CR);fitView();render();
}
function fitView(){
  const vw=vp.clientWidth,vh=vp.clientHeight;
  camZ=Math.min((vw-60)/CW,(vh-60)/CH,1);
  camX=Math.round((vw-CW*camZ)/2);camY=Math.round((vh-CH*camZ)/2);applyCam();
}
function applyCam(){cwrap.style.transform='translate('+camX+'px,'+camY+'px) scale('+camZ+')';zbadge.textContent=Math.round(camZ*100)+'%'}

function render(){
  ctx.clearRect(0,0,CW,CH);
  ctx.strokeStyle='#e8e4de';ctx.lineWidth=1;
  for(let i=0;i<=CW;i+=GRID){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,CH);ctx.stroke()}
  for(let j=0;j<=CH;j+=GRID){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(CW,j);ctx.stroke()}
  ctx.strokeStyle='#d8d3cc';
  for(let i=0;i<=CW;i+=GRID*4){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,CH);ctx.stroke()}
  for(let j=0;j<=CH;j+=GRID*4){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(CW,j);ctx.stroke()}
  // Two-pass：先畫線段（牆/窗），再畫 fixed/rect（門/家具），確保門蓋過牆
  var lineEls=els.filter(function(e){return e.type==='line';});
  var otherEls=els.filter(function(e){return e.type!=='line';});
  lineEls.concat(otherEls).forEach(el=>{
    ctx.save();ctx.setLineDash([]);
    if(el.type==='line'){
      if(el.isWin){
        const ang=Math.atan2(el.y2-el.y1,el.x2-el.x1),len=Math.hypot(el.x2-el.x1,el.y2-el.y1);
        ctx.translate(el.x1,el.y1);ctx.rotate(ang);
        ctx.fillStyle=el.color;ctx.fillRect(0,-el.thickness/2,len,el.thickness);
        ctx.strokeStyle=P.WINB;ctx.lineWidth=1.5;ctx.strokeRect(0,-el.thickness/2,len,el.thickness);
        ctx.strokeStyle='rgba(125,211,252,.6)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(len,0);ctx.stroke();
      } else {
        ctx.strokeStyle=el.color;ctx.lineWidth=el.thickness;
        ctx.lineCap='square';ctx.lineJoin='miter';
        ctx.beginPath();ctx.moveTo(el.x1,el.y1);ctx.lineTo(el.x2,el.y2);ctx.stroke();
        ctx.lineCap='butt';
      }
      if(sel===el){ctx.restore();ctx.save();[[el.x1,el.y1],[el.x2,el.y2]].forEach(([px,py])=>{ctx.fillStyle=P.SEL;ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(px,py,HR,0,Math.PI*2);ctx.fill();ctx.stroke()})}
}else if(el.type==='rect'){
      ctx.shadowColor='rgba(0,0,0,.06)';ctx.shadowBlur=8;ctx.shadowOffsetX=2;ctx.shadowOffsetY=2;ctx.fillStyle=el.fill;ctx.fillRect(el.x,el.y,el.w,el.h);ctx.shadowColor='transparent';ctx.strokeStyle=el.color;ctx.lineWidth=4.5;ctx.strokeRect(el.x,el.y,el.w,el.h);
      if(sel===el){ctx.setLineDash([7,4]);ctx.strokeStyle=P.SEL;ctx.lineWidth=1.5;ctx.strokeRect(el.x-7,el.y-7,el.w+14,el.h+14);ctx.setLineDash([]);ctx.fillStyle=P.SEL;ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(el.x+el.w,el.y+el.h,HR,0,Math.PI*2);ctx.fill();ctx.stroke()}
    }else{
      ctx.translate(el.x+el.w/2,el.y+el.h/2);ctx.rotate(el.rotation*Math.PI/180);el.draw(ctx,el.w,el.h,el);
      if(sel===el){
        const pad=HPAD;ctx.setLineDash([7,4]);ctx.strokeStyle=P.SEL;ctx.lineWidth=1.5;ctx.strokeRect(-el.w/2-pad,-el.h/2-pad,el.w+pad*2,el.h+pad*2);ctx.setLineDash([]);
        const brx=el.w/2+pad,bry=el.h/2+pad;ctx.fillStyle=P.SEL;ctx.strokeStyle='#fff';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(brx,bry,HR,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(brx-3.5,bry);ctx.lineTo(brx+3.5,bry);ctx.stroke();ctx.beginPath();ctx.moveTo(brx,bry-3.5);ctx.lineTo(brx,bry+3.5);ctx.stroke();
        const rhx=0,rhy=-el.h/2-pad-24;ctx.strokeStyle=P.SEL;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-el.h/2-pad);ctx.lineTo(rhx,rhy);ctx.stroke();ctx.fillStyle='#fff';ctx.strokeStyle=P.SEL;ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(rhx,rhy,HR,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle=P.SEL;ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(rhx,rhy,4.5,-Math.PI*.75,Math.PI*.25);ctx.stroke();ctx.beginPath();ctx.arc(rhx,rhy,4.5,Math.PI*.1,Math.PI);ctx.stroke();
      }
    }
    ctx.restore();
  });
  selbar.style.display=(sel&&selGroup.length===0)?'flex':'none';
  zobtns.style.display=(sel||selGroup.length>0)?'flex':'none';
  // 選取文字標籤時同步字級按鈕狀態
  if(sel&&sel._t==='text'){
    var curTsz=sel.tsz||'md';
    var isPreset=['sm','md','lg'].includes(curTsz);
    document.querySelectorAll('.sizebtn').forEach(function(b){
      b.classList.toggle('on',isPreset&&b.dataset.sz===curTsz);
    });
    var fsin=document.getElementById('fsinput');
    if(fsin)fsin.value=isPreset?'':curTsz;
    // 更新 lsz 讓下次新增同步
    lsz=curTsz;
  }
  zobtns.style.display=(sel||selGroup.length>0)?'flex':'none';
}

function v2c(cx,cy){const r=vp.getBoundingClientRect();return{x:(cx-r.left-camX)/camZ,y:(cy-r.top-camY)/camZ}}
function toLoc(el,px,py){const cx=el.x+el.w/2,cy=el.y+el.h/2,rad=-el.rotation*Math.PI/180,dx=px-cx,dy=py-cy;return{x:dx*Math.cos(rad)-dy*Math.sin(rad),y:dx*Math.sin(rad)+dy*Math.cos(rad)}}
function getH(el){return{rotate:{x:0,y:-el.h/2-HPAD-24},br:{x:el.w/2+HPAD,y:el.h/2+HPAD}}}
function hitTest(pos){
  for(let i=els.length-1;i>=0;i--){
    const el=els[i];
    if(el.type==='line'){const d=Math.abs((el.y2-el.y1)*pos.x-(el.x2-el.x1)*pos.y+el.x2*el.y1-el.y2*el.x1)/Math.hypot(el.y2-el.y1,el.x2-el.x1);const inn=pos.x>=Math.min(el.x1,el.x2)-20&&pos.x<=Math.max(el.x1,el.x2)+20&&pos.y>=Math.min(el.y1,el.y2)-20&&pos.y<=Math.max(el.y1,el.y2)+20;if(d<20&&inn)return el}
    else if(el.type==='fixed'){const l=toLoc(el,pos.x,pos.y);if(l.x>=-el.w/2&&l.x<=el.w/2&&l.y>=-el.h/2&&l.y<=el.h/2)return el}
    else{if(pos.x>=el.x&&pos.x<=el.x+el.w&&pos.y>=el.y&&pos.y<=el.y+el.h)return el}
  }
  return null;
}

function applyDrag(pos){
  const s=sel;
  if(hdl==='move'){if(s.type==='line'){s.x1=snp(pos.x-dOff.dx1);s.y1=snp(pos.y-dOff.dy1);s.x2=snp(pos.x-dOff.dx2);s.y2=snp(pos.y-dOff.dy2)}else{s.x=snp(pos.x-dOff.dx);s.y=snp(pos.y-dOff.dy)}}
  else if(hdl==='p1'){s.x1=snp(pos.x);s.y1=snp(pos.y)}
  else if(hdl==='p2'){s.x2=snp(pos.x);s.y2=snp(pos.y)}
  else if(hdl==='br'&&s.type==='rect'){s.w=Math.max(30,snp(pos.x-s.x));s.h=Math.max(30,snp(pos.y-s.y))}
  else if(hdl==='rotate'){const cx=s.x+s.w/2,cy=s.y+s.h/2;s.rotation=((Math.atan2(pos.y-cy,pos.x-cx)*180/Math.PI+90)%360+360)%360}
  else if(hdl==='scale_br'){
    const cx=s.x+s.w/2,cy=s.y+s.h/2,l=toLoc(s,pos.x,pos.y);
    if(s._t==='text'){
      // 文字：根據拖曳距離換算字級（8~120px）
      var dist=Math.max(Math.abs(l.x)*2,Math.abs(l.y)*2);
      var newFs=Math.min(120,Math.max(8,Math.round(dist*0.8)));
      s.tsz=String(newFs);
    } else {
      // 等比例縮放：以較大方向為基準，保持原始長寬比
      var ratio=dOff.sw/dOff.sh;
      var dx=Math.abs(l.x)*2-HPAD*2, dy=Math.abs(l.y)*2-HPAD*2;
      var nw,nh;
      if(dx/dy>ratio){ nw=Math.max(24,dx); nh=Math.max(24,nw/ratio); }
      else { nh=Math.max(24,dy); nw=Math.max(24,nh*ratio); }
      s.w=nw;s.h=nh;s.x=cx-nw/2;s.y=cy-nh/2;
    }
  }
  
}

vp.addEventListener('wheel',function(e){
  e.preventDefault();const r=vp.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;
  const f=e.deltaY<0?1.1:.9,nz=Math.min(4,Math.max(.12,camZ*f));
  camX=cx-(cx-camX)*(nz/camZ);camY=cy-(cy-camY)*(nz/camZ);camZ=nz;applyCam();
},{passive:false});

document.addEventListener('keydown',function(e){
  if(e.code==='Space'&&e.target.tagName!=='INPUT'){space=true;vp.style.cursor='grab'}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){e.preventDefault();copyEl()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){e.preventDefault();pasteEl()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
  if((e.key==='Delete'||e.key==='Backspace')&&e.target.tagName!=='INPUT')delSel();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&e.target.tagName!=='INPUT'){
    if(!sel&&selGroup.length===0)return;
    e.preventDefault();
    var step=e.shiftKey?1:GRID;
    var dx=0,dy=0;
    if(e.key==='ArrowLeft')dx=-step;
    if(e.key==='ArrowRight')dx=step;
    if(e.key==='ArrowUp')dy=-step;
    if(e.key==='ArrowDown')dy=step;
    var targets=selGroup.length>0?selGroup:[sel];
    targets.forEach(function(el){
      if(el.type==='line'){el.x1+=dx;el.y1+=dy;el.x2+=dx;el.y2+=dy}
      else{el.x+=dx;el.y+=dy}
    });
    saveH();render();
  }
});
document.addEventListener('keyup',function(e){if(e.code==='Space'){space=false;vp.style.cursor='default'}});

vp.addEventListener('mousedown',function(e){
  if(e.target.closest('#selbar')||e.target.closest('#zobtns'))return;
  if(e.button===1||space){isPan=true;panSt={x:e.clientX,y:e.clientY};panCam={x:camX,y:camY};vp.style.cursor='grabbing';return}
  if(e.button!==0)return;
  const pos=v2c(e.clientX,e.clientY),th=(HR+6)/camZ;
  if(sel){
    const s=sel;
    if(s.type==='line'){if(Math.hypot(pos.x-s.x1,pos.y-s.y1)<th){hdl='p1';isDrag=true;return}if(Math.hypot(pos.x-s.x2,pos.y-s.y2)<th){hdl='p2';isDrag=true;return}}
    else if(s.type==='rect'){if(Math.hypot(pos.x-(s.x+s.w),pos.y-(s.y+s.h))<th){hdl='br';isDrag=true;return}}
    else if(s.type==='fixed'){const l=toLoc(s,pos.x,pos.y),H=getH(s);if(Math.hypot(l.x-H.rotate.x,l.y-H.rotate.y)<th){hdl='rotate';isDrag=true;dOff={};return}if(Math.hypot(l.x-H.br.x,l.y-H.br.y)<th){hdl='scale_br';isDrag=true;dOff={sw:s.w,sh:s.h};return}}
  }
  const h=hitTest(pos);
  if(h){
    if(e.ctrlKey||e.metaKey){
      var gi=selGroup.indexOf(h);
      if(gi>=0) selGroup.splice(gi,1); else selGroup.push(h);
      sel=selGroup.length>0?selGroup[selGroup.length-1]:null;
      render();return;
    }
    sel=h;selGroup=[];isDrag=true;hdl='move';vp.style.cursor='grabbing';
    if(h.type==='line')dOff={dx1:pos.x-h.x1,dy1:pos.y-h.y1,dx2:pos.x-h.x2,dy2:pos.y-h.y2};
    else dOff={dx:pos.x-h.x,dy:pos.y-h.y};
    render();return;
  }
  sel=null;selGroup=[];render();
});
window.addEventListener('mousemove',function(e){

  }
    if(!isDrag&&!space){

    if(sel){
      if(sel.type==='fixed'){
        var l=toLoc(sel,pos2.x,pos2.y),H=getH(sel);
        if(Math.hypot(l.x-H.rotate.x,l.y-H.rotate.y)<th2) cur='alias';
        else if(Math.hypot(l.x-H.br.x,l.y-H.br.y)<th2) cur='nwse-resize';
        else if(l.x>=-sel.w/2&&l.x<=sel.w/2&&l.y>=-sel.h/2&&l.y<=sel.h/2) cur='grab';
        else cur='default';
      } else if(sel.type==='line'){
        if(Math.hypot(pos2.x-sel.x1,pos2.y-sel.y1)<th2||Math.hypot(pos2.x-sel.x2,pos2.y-sel.y2)<th2)
          cur='ew-resize';
        else cur='grab';
      } else if(sel.type==='rect'){
        if(Math.hypot(pos2.x-(sel.x+sel.w),pos2.y-(sel.y+sel.h))<th2) cur='nwse-resize';
        else if(pos2.x>=sel.x&&pos2.x<=sel.x+sel.w&&pos2.y>=sel.y&&pos2.y<=sel.y+sel.h) cur='grab';
      }
    }
    vp.style.cursor=cur;
  }
});
window.addEventListener('mouseup',function(){
  if(isPan){isPan=false;vp.style.cursor=space?'grab':'default'}
  if(isDrag){isDrag=false;hdl=null;saveH();vp.style.cursor='default';}
});
vp.addEventListener('touchstart',function(e){
  if(e.touches.length===2){pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);isPan=true;panSt={x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2};panCam={x:camX,y:camY};return}
  const tc={x:e.touches[0].clientX,y:e.touches[0].clientY},pos=v2c(tc.x,tc.y),th=(HR+14)/camZ;
  if(sel){const s=sel;if(s.type==='line'){if(Math.hypot(pos.x-s.x1,pos.y-s.y1)<th){hdl='p1';isDrag=true;return}if(Math.hypot(pos.x-s.x2,pos.y-s.y2)<th){hdl='p2';isDrag=true;return}}else if(s.type==='rect'){if(Math.hypot(pos.x-(s.x+s.w),pos.y-(s.y+s.h))<th){hdl='br';isDrag=true;return}}else if(s.type==='fixed'){const l=toLoc(s,pos.x,pos.y),H=getH(s);if(Math.hypot(l.x-H.rotate.x,l.y-H.rotate.y)<th){hdl='rotate';isDrag=true;dOff={};return}if(Math.hypot(l.x-H.br.x,l.y-H.br.y)<th){hdl='scale_br';isDrag=true;dOff={sw:s.w,sh:s.h};return}}}
  const h=hitTest(pos);if(h){sel=h;isDrag=true;hdl='move';vp.style.cursor='grabbing';if(h.type==='line')dOff={dx1:pos.x-h.x1,dy1:pos.y-h.y1,dx2:pos.x-h.x2,dy2:pos.y-h.y2};else dOff={dx:pos.x-h.x,dy:pos.y-h.y};render();return}
  isPan=true;panSt=tc;panCam={x:camX,y:camY};
},{passive:false});
vp.addEventListener('touchmove',function(e){
  if(e.cancelable)e.preventDefault();
  if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;const r=vp.getBoundingClientRect(),lx=mx-r.left,ly=my-r.top;if(pinch){const f=d/pinch,nz=Math.min(4,Math.max(.12,camZ*f));camX=lx-(lx-camX)*(nz/camZ);camY=ly-(ly-camY)*(nz/camZ);camZ=nz;applyCam()}pinch=d;return}
  const tc={x:e.touches[0].clientX,y:e.touches[0].clientY};if(isDrag&&sel){applyDrag(v2c(tc.x,tc.y));render();return}if(isPan&&panSt){camX=panCam.x+(tc.x-panSt.x);camY=panCam.y+(tc.y-panSt.y);applyCam()}
},{passive:false});
vp.addEventListener('touchend',function(){pinch=0;if(isDrag){isDrag=false;hdl=null;saveH()}if(isPan)isPan=false});

function copyEl(){
  if(!sel)return;
  var r={...sel};
  delete r.draw;
  clipboard=JSON.stringify(r);
}
function pasteEl(){
  if(!clipboard)return;
  var o=JSON.parse(clipboard);
  var cfg=CFG[o._t]||{};
  var el={...cfg,...o,draw:cfg.draw};
  if(el.type==='line'){
    // 線段：周圍隨機偏移
    var dx=(Math.random()*2-1)*GRID*3;
    var dy=(Math.random()*2-1)*GRID*3;
    if(Math.abs(dx)<GRID&&Math.abs(dy)<GRID){dx=GRID;dy=GRID;}
    el.x1=snp(el.x1+dx);el.y1=snp(el.y1+dy);
    el.x2=snp(el.x2+dx);el.y2=snp(el.y2+dy);
  } else {
    var ew=el.w||80, eh=el.h||40;
    var range=GRID*3, tries=0, ex, ey;
    do {
      var rx=(Math.random()*2-1)*range;
      var ry=(Math.random()*2-1)*range;
      if(Math.abs(rx)<GRID&&Math.abs(ry)<GRID){rx=rx<0?-GRID:GRID;ry=ry<0?-GRID:GRID;}
      ex=snp(el.x+rx); ey=snp(el.y+ry);
      tries++;
    } while((ex<0||ex+ew>CW||ey<0||ey+eh>CH)&&tries<20);
    if(ex<0||ex+ew>CW||ey<0||ey+eh>CH){
      ex=snp(GRID+Math.random()*(CW-ew-GRID*2));
      ey=snp(GRID+Math.random()*(CH-eh-GRID*2));
    }
    el.x=ex; el.y=ey;
  }
  els.push(el);sel=el;selGroup=[];saveH();render();
  // 更新 clipboard 為最新貼上位置，方便連續貼上
  var r2={...el};delete r2.draw;clipboard=JSON.stringify(r2);
}
function rotSel(){
  if(!sel)return;
  if(sel.type==='fixed'){
    sel.rotation=(sel.rotation+45)%360;saveH();render();
  } else if(sel.type==='line'){
    // 線段：以中心點為軸旋轉 45 度
    var cx=(sel.x1+sel.x2)/2, cy=(sel.y1+sel.y2)/2;
    var ang=45*Math.PI/180;
    var cos=Math.cos(ang), sin=Math.sin(ang);
    var dx1=sel.x1-cx, dy1=sel.y1-cy;
    var dx2=sel.x2-cx, dy2=sel.y2-cy;
    sel.x1=snp(cx+dx1*cos-dy1*sin);
    sel.y1=snp(cy+dx1*sin+dy1*cos);
    sel.x2=snp(cx+dx2*cos-dy2*sin);
    sel.y2=snp(cy+dx2*sin+dy2*cos);
    saveH();render();
  } else if(sel.type==='rect'){
    // 矩形：暫不旋轉（矩形不支援旋轉）
  }
}
function delSel(){if(!sel)return;els=els.filter(function(e){return e!==sel});sel=null;saveH();render()}
function clearAll(){els=[];sel=null;saveH();render()}
function moveLayer(dir){if(!sel)return;const i=els.indexOf(sel),j=i+dir;if(j<0||j>=els.length)return;const tmp=els[i];els[i]=els[j];els[j]=tmp;saveH();render()}
function layerTop(){if(!sel)return;const i=els.indexOf(sel);if(i<0)return;els.splice(i,1);els.push(sel);saveH();render()}
function layerBottom(){if(!sel)return;const i=els.indexOf(sel);if(i<0)return;els.splice(i,1);els.unshift(sel);saveH();render()}
function saveImg(){const p=sel;sel=null;render();const a=document.createElement('a');a.download='格局圖_'+Date.now()+'.png';a.href=canvas.toDataURL('image/png');a.click();sel=p;render()}
function toggleSnap(){snapOn=!snapOn;document.getElementById('snappill').classList.toggle('on',snapOn)}
function toggleSec(hd){hd.classList.toggle('open');hd.nextElementSibling.classList.toggle('closed')}
